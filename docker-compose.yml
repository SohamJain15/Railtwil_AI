services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: railtwin
      POSTGRES_USER: railtwin
      POSTGRES_PASSWORD: railtwin
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U railtwin -d railtwin"], interval: 5s, timeout: 5s, retries: 10}
    volumes: ["./docker/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://railtwin:railtwin@postgres:5432/railtwin
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173
    volumes: ["./backend:/app/backend", "./data:/app/data"]
    ports: ["8000:8000"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    environment: {VITE_API_URL: http://localhost:8000}
    ports: ["5173:5173"]
    depends_on: [backend]
