[project]
name = "railtwin-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "geoalchemy2>=0.15,<1",
  "alembic>=1.14,<2",
  "redis>=5,<6",
  "networkx>=3.3,<4",
  "pandas>=2.2,<3",
  "python-multipart>=0.0.9,<1",
]
[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1", "pytest-asyncio>=0.24,<1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
